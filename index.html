<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dumpster Crawl | Rental Management</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #111;
    }

    header {
      background: #050505;
      color: white;
      padding: 22px 30px;
      border-bottom: 5px solid #ffc650;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 5px 0 0;
      color: #ffc650;
      font-weight: bold;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 25px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      border-top: 5px solid #ffc650;
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 14px;
      color: #666;
      text-transform: uppercase;
    }

    .number {
      font-size: 34px;
      font-weight: bold;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 20px;
    }

    .panel {
      background: white;
      padding: 22px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }

    .panel h2 {
      margin-top: 0;
      border-bottom: 3px solid #ffc650;
      padding-bottom: 10px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    textarea {
      min-height: 75px;
    }

    button {
      margin-top: 18px;
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 6px;
      background: #ffc650;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #eeb43e;
    }

    .dumpster {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 7px;
      margin-bottom: 9px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .available {
      color: #17823b;
      font-weight: bold;
    }

    .rented {
      color: #b3261e;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th {
      background: #111;
      color: white;
      text-align: left;
      padding: 10px;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    .empty {
      color: #777;
      padding: 15px 0;
    }

    .small {
      color: #666;
      font-size: 13px;
    }

    @media (max-width: 850px) {
      .cards {
        grid-template-columns: 1fr 1fr;
      }

      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Dumpster Crawl & Rentals</h1>
  <p>Rental Management Software</p>
</header>

<div class="container">

  <div class="cards">

    <div class="card">
      <h3>Total Dumpsters</h3>
      <div class="number" id="totalDumpsters">6</div>
    </div>

    <div class="card">
      <h3>Available</h3>
      <div class="number" id="availableDumpsters">6</div>
    </div>

    <div class="card">
      <h3>Active Rentals</h3>
      <div class="number" id="activeRentals">0</div>
    </div>

    <div class="card">
      <h3>Upcoming Pickups</h3>
      <div class="number" id="upcomingPickups">0</div>
    </div>

  </div>

  <div class="layout">

    <div>

      <div class="panel">

        <h2>Create Rental</h2>

        <form id="rentalForm">

          <label>Customer Name</label>
          <input id="customerName" required>

          <label>Phone Number</label>
          <input id="phone" type="tel" required>

          <label>Email</label>
          <input id="email" type="email">

          <label>Delivery Address</label>
          <input id="address" required>

          <label>Dumpster</label>
          <select id="dumpsterSelect" required></select>

          <label>Delivery Date</label>
          <input id="deliveryDate" type="date" required>

          <label>Pickup Date</label>
          <input id="pickupDate" type="date" required>

          <label>Rental Price</label>
          <input id="price" type="number" step="0.01" placeholder="Example: 469">

          <label>Notes</label>
          <textarea id="notes"
            placeholder="Placement instructions, gate codes, special requests, etc."></textarea>

          <button type="submit">
            Create Rental
          </button>

        </form>

      </div>

    </div>

    <div>

      <div class="panel">

        <h2>Dumpster Inventory</h2>

        <div id="inventory"></div>

      </div>

      <div class="panel">

        <h2>Active Rentals</h2>

        <div id="rentalArea"></div>

      </div>

    </div>

  </div>

</div>

<script>

const dumpsters = [
  { id: "20-01", size: "20 Yard" },
  { id: "20-02", size: "20 Yard" },
  { id: "20-03", size: "20 Yard" },
  { id: "20-04", size: "20 Yard" },
  { id: "20-05", size: "20 Yard" },
  { id: "30-01", size: "30 Yard" }
];

let rentals =
  JSON.parse(localStorage.getItem("dumpsterRentals")) || [];

function saveRentals() {

  localStorage.setItem(
    "dumpsterRentals",
    JSON.stringify(rentals)
  );

}

function dumpsterIsRented(id) {

  return rentals.some(
    rental => rental.dumpster === id
  );

}

function updateDashboard() {

  const rentedCount = rentals.length;

  document.getElementById("totalDumpsters").textContent =
    dumpsters.length;

  document.getElementById("activeRentals").textContent =
    rentedCount;

  document.getElementById("availableDumpsters").textContent =
    dumpsters.length - rentedCount;

  document.getElementById("upcomingPickups").textContent =
    rentals.length;

}

function renderInventory() {

  const inventory =
    document.getElementById("inventory");

  inventory.innerHTML = "";

  dumpsters.forEach(dumpster => {

    const rented =
      dumpsterIsRented(dumpster.id);

    const row =
      document.createElement("div");

    row.className = "dumpster";

    row.innerHTML = `
      <div>
        <strong>${dumpster.id}</strong>
        <div class="small">${dumpster.size}</div>
      </div>

      <span class="${rented ? "rented" : "available"}">
        ${rented ? "RENTED" : "AVAILABLE"}
      </span>
    `;

    inventory.appendChild(row);

  });

}

function renderDumpsterOptions() {

  const select =
    document.getElementById("dumpsterSelect");

  select.innerHTML =
    '<option value="">Select available dumpster</option>';

  dumpsters.forEach(dumpster => {

    if (!dumpsterIsRented(dumpster.id)) {

      const option =
        document.createElement("option");

      option.value =
        dumpster.id;

      option.textContent =
        `${dumpster.id} — ${dumpster.size}`;

      select.appendChild(option);

    }

  });

}

function renderRentals() {

  const area =
    document.getElementById("rentalArea");

  if (rentals.length === 0) {

    area.innerHTML =
      '<div class="empty">No active rentals yet.</div>';

    return;

  }

  let html = `
    <table>
      <thead>
        <tr>
          <th>Customer</th>
          <th>Dumpster</th>
          <th>Delivery</th>
          <th>Pickup</th>
        </tr>
      </thead>

      <tbody>
  `;

  rentals.forEach(rental => {

    html += `
      <tr>
        <td>${rental.customer}</td>
        <td>${rental.dumpster}</td>
        <td>${rental.delivery}</td>
        <td>${rental.pickup}</td>
      </tr>
    `;

  });

  html += `
      </tbody>
    </table>
  `;

  area.innerHTML = html;

}

document
  .getElementById("rentalForm")
  .addEventListener("submit", function(event) {

    event.preventDefault();

    const dumpster =
      document.getElementById("dumpsterSelect").value;

    if (!dumpster) {

      alert("Please select an available dumpster.");

      return;

    }

    const rental = {

      customer:
        document.getElementById("customerName").value,

      phone:
        document.getElementById("phone").value,

      email:
        document.getElementById("email").value,

      address:
        document.getElementById("address").value,

      dumpster:
        dumpster,

      delivery:
        document.getElementById("deliveryDate").value,

      pickup:
        document.getElementById("pickupDate").value,

      price:
        document.getElementById("price").value,

      notes:
        document.getElementById("notes").value

    };

    rentals.push(rental);

    saveRentals();

    this.reset();

    refresh();

    alert(
      "Rental created successfully for " +
      rental.dumpster
    );

  });

function refresh() {

  updateDashboard();
  renderInventory();
  renderDumpsterOptions();
  renderRentals();

}

refresh();

</script>

</body>
</html>
