<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dumpster Crawl Rental Manager</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 22px;
      text-align: center;
      border-bottom: 5px solid #ffc650;
    }

    header h1 {
      margin-bottom: 5px;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 20px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 18px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .number {
      font-size: 32px;
      font-weight: bold;
    }

    .yellow {
      color: #d89b00;
    }

    .section {
      background: white;
      padding: 25px;
      border-radius: 10px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .section h2 {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 5px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      background: #ffc650;
      color: #111;
      border: none;
      padding: 14px 22px;
      margin-top: 20px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #e5ad32;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th,
    td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #f1f1f1;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>Dumpster Crawl & Dumpster Rentals</h1>
  <p>Rental Management Dashboard</p>
</header>

<div class="container">

  <div class="dashboard">

    <div class="card">
      <h3>Available Dumpsters</h3>
      <div class="number yellow">0</div>
    </div>

    <div class="card">
      <h3>Active Rentals</h3>
      <div class="number">0</div>
    </div>

    <div class="card">
      <h3>Deliveries Today</h3>
      <div class="number">0</div>
    </div>

    <div class="card">
      <h3>Pickups Today</h3>
      <div class="number">0</div>
    </div>

  </div>


  <div class="section">

    <h2>Create New Booking</h2>

    <form id="bookingForm">

      <label>Customer Name</label>
      <input type="text" id="customerName" required>

      <label>Phone Number</label>
      <input type="tel" id="phone" required>

      <label>Email</label>
      <input type="email" id="email">

      <label>Delivery Address</label>
      <input type="text" id="address" required>

      <label>Dumpster Package</label>

      <select id="dumpster">

        <option value="">Choose a dumpster</option>

        <option>
          20 Yard - 1 Ton - $389 - 7 Days
        </option>

        <option>
          20 Yard - 2 Tons - $469 - 12 Days
        </option>

        <option>
          20 Yard - 3 Tons - $529 - 12 Days
        </option>

        <option>
          30 Yard - 4 Tons - $595 - 12 Days
        </option>

        <option>
          30 Yard - 5 Tons - $659 - 12 Days
        </option>

      </select>

      <label>Delivery Date</label>
      <input type="date" id="deliveryDate" required>

      <label>Placement Instructions</label>
      <input
        type="text"
        id="instructions"
        placeholder="Example: Left side of driveway"
      >

      <button type="submit">
        Create Booking
      </button>

    </form>

  </div>


  <div class="section">

    <h2>Upcoming Rentals</h2>

    <table>

      <thead>
        <tr>
          <th>Customer</th>
          <th>Dumpster</th>
          <th>Delivery</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody id="bookingList">

        <tr>
          <td colspan="4">
            No bookings yet.
          </td>
        </tr>

      </tbody>

    </table>

  </div>

</div>


<footer>
  Dumpster Crawl & Dumpster Rentals<br>
  262-664-9198
</footer>


<script>

const form = document.getElementById("bookingForm");
const bookingList = document.getElementById("bookingList");

form.addEventListener("submit", function(event) {

  event.preventDefault();

  const customer =
    document.getElementById("customerName").value;

  const dumpster =
    document.getElementById("dumpster").value;

  const delivery =
    document.getElementById("deliveryDate").value;

  bookingList.innerHTML = "";

  const row = document.createElement("tr");

  row.innerHTML = `
    <td>${customer}</td>
    <td>${dumpster}</td>
    <td>${delivery}</td>
    <td>Scheduled</td>
  `;

  bookingList.appendChild(row);

  form.reset();

});

</script>

</body>
</html>
